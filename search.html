<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web67 夜市小吃評鑑</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="bootstrap.css">
</head>

<body>
    <header data-bs-theme="dark">
        <nav class="navbar-expand-lg navbar d-block">
            <nav class="titles d-flex align-items-center gap-3">
                <img src="logo.png" alt="logo" tabindex="0" class="logo">
                <div class="d-lg-flex d-block gap-3 align-items-center">
                    <h1 class="title" tabindex="0">Web67 夜市小吃評鑑</h1>
                    <span class="slogan d-none d-md-block" tabindex="0">吃遍夜市,好味道你說了算</span>
                </div>
                <div class="functions ms-auto d-flex gap-3 align-items-center">
                    <select name="font" id="font" class="form-control">
                        <option value="14">A-</option>
                        <option value="16">A</option>
                        <option value="20">A+</option>
                    </select>
                    <select name="theme" id="theme" class="form-control">
                        <option value="dark">🌚</option>
                        <option value="light">🌞</option>
                        <option value="system">💻</option>
                    </select>
                    <button class="navbar-toggler" data-bs-target="#nav" data-bs-toggle="collapse">
                        <span class="navbar-toggler-icon"></span>
                    </button>
                </div>
            </nav>
            <nav class="navbar-collapse row show" id="nav">
                <a href="index.html" class="link col-12 col-md-3" tabindex="0">首頁</a>
                <a href="search.html" class="link col-12 col-md-3" tabindex="0">夜市查詢</a>
                <a href="review.html" class="link col-12 col-md-3" tabindex="0">美食評鑑</a>
                <a href="login.html" class="link col-12 col-md-3" tabindex="0">系統管理</a>
            </nav>
        </nav>
    </header>
    <main>
        <section id="breadcrumb" class="col-10 mx-auto my-3 p-2">
            <a href="index.html" tabindex="0">首頁</a><span tabindex="0">/夜市查詢</span>
        </section>
        <section class="col-10 my-3 mx-auto p-2">
            <article class="card card-body">
                <form id="search" class="row">
                    <div class="col">
                        <label for="location">選擇縣市</label>
                        <select name="location" id="location" class="form-control"></select>
                    </div>
                    <div class="col">
                        <label for="sorting">排序</label>
                        <select name="sorting" id="sorting" class="form-control">
                            <option value="crowd+asc">人潮指數(升冪)</option>
                            <option value="crowd+desc">人潮指數(降冪)</option>
                            <option value="average+asc">平均消費(升冪)</option>
                            <option value="average+desc">平均消費(降冪)</option>
                            <option value="parking+asc">停車便利度(升冪)</option>
                            <option value="parking+desc">停車便利度(降冪)</option>
                        </select>
                    </div>
                    <div class="col">
                        <label for="layout">呈現方式</label>
                        <select name="layout" id="layout" class="form-control">
                            <option value="card">卡片</option>
                            <option value="table">表格</option>
                        </select>
                    </div>
                    <div class="col-auto"><button class="btn btn-primary">查詢</button></div>
                </form>
            </article>
        </section>
        <section class="p-1 mx-auto my-3 col-10" id="result"></section>
    </main>
    <footer class="text-center">
        <p>第19屆全國身心障礙者技能競賽 模擬練習 設計者：Web67</p>
    </footer>
    <script src="bootstrap.js"></script>
    <script src="jqueryv4.0.0.js"></script>
    <script src="main.js"></script>
    <script>
        const COLS = [
            ["夜市", "", `nightmarket`],
            ["縣市", "", `city`],
            ["營業時間", "", `openning`],
            ["人潮指數", "（分）", `crowd`],
            ["平均消費", "（元）", `average`],
            ["停車便利度", "（1–5）", `parking`],
            ["適合造訪程度", "", `recommandation`],
            ["備註", "", `note`]
        ]
        function render() {
            $.post("api.php", {action: "locations"}, function (res) {
                const locations = JSON.parse(res)
                let html = "<option value='all'>所有城市</option>"
                locations.forEach((row) => {
                    html += `<option value="${row['city']}">${row['city']}</option>`
                });
                $("#location").html(html)
            })
        }
        render()
        $("#search").on("submit", function (e) {
            e.preventDefault()
            const form = new FormData(this)
            form.append("action", "search")
            fetch("api.php", {method: "POST", body: form})
                .then((res) => res.json())
                .then((res) => {
                    if (form.get("layout") == "card") {
                        card(res)
                    } else {
                        table(res)
                    }
                })
        })
        function card(data) {
            html = "<article class='row row-cols-1 row-cols-md-2'>"
            if (data.length > 0) {
                data.forEach((row) => {
                    html += `<article class='col p-1'><article class='card card-body'>
                    ${COLS.map(([label, suffix, key]) => {
                        const val = row[key]
                        if (key == "note") return `<article tabindex="0">${label}:<br>${cut(val)}</article>`
                        if (key == "recommandation") return `<article tabindex="0">${label}:<br>${level(row)}</article>`
                        if (val == null) return `<article tabindex="0">${label}:<br>${empty()}</article>`
                        else return `<article tabindex="0">${label}:<br>${val + suffix}</article>`
                    }).join("")}</article></article>`
                });
            } else {
                html += empty()
            }
            html += "</article>"

            $("#result").html(html)
        }
        function table(data) {
            html = `<article class='card card-body'><table class='table'><tr>
            ${COLS.map(([label, suffix, key]) => {
                return `<th tabindex="0">${label}</th>`
            }).join("")}</tr>`
            if (data.length > 0) {
                data.forEach((row) => {
                    html += `<tr>
                    ${COLS.map(([label, suffix, key]) => {
                        const val = row[key]
                        if (key == "note") return `<td tabindex="0">${cut(val)}</td>`
                        if (key == "recommandation") return `<td tabindex="0">${level(row)}</td>`
                        if (val == null) return `<td tabindex="0">${empty()}</td>`
                        else return `<td tabindex="0">${val + suffix}</td>`
                    }).join("")}</tr>`
                });
            } else {
                html += empty()
            }
            html += "</table></article>"

            $("#result").html(html)
        }
    </script>
</body>

</html>
