<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web67 夜市小吃評鑑</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="bootstrap.css">
</head>

<body>
    <header data-bs-theme="dark">
        <nav class="navbar-expand-lg navbar d-block">
            <nav class="titles d-flex align-items-center gap-3">
                <img src="logo.png" alt="logo" tabindex="0" class="logo">
                <div class="d-lg-flex d-block gap-3 align-items-center">
                    <h1 class="title" tabindex="0">Web67 夜市小吃評鑑</h1>
                    <span class="slogan d-none d-md-block" tabindex="0">吃遍夜市,好味道你說了算</span>
                </div>
                <div class="functions ms-auto d-flex gap-3 align-items-center">
                    <select name="font" id="font" class="form-control">
                        <option value="14">A-</option>
                        <option value="16">A</option>
                        <option value="20">A+</option>
                    </select>
                    <select name="theme" id="theme" class="form-control">
                        <option value="dark">🌚</option>
                        <option value="light">🌞</option>
                        <option value="system">💻</option>
                    </select>
                    <button class="navbar-toggler" data-bs-target="#nav" data-bs-toggle="collapse">
                        <span class="navbar-toggler-icon"></span>
                    </button>
                </div>
            </nav>
            <nav class="navbar-collapse row show" id="nav">
                <a href="index.html" class="link col-12 col-md-3" tabindex="0">首頁</a>
                <a href="search.html" class="link col-12 col-md-3" tabindex="0">夜市查詢</a>
                <a href="review.html" class="link col-12 col-md-3" tabindex="0">美食評鑑</a>
                <a href="login.html" class="link col-12 col-md-3" tabindex="0">系統管理</a>
            </nav>
        </nav>
    </header>
    <main>
        <section id="breadcrumb" class="col-10 mx-auto my-3 p-2">
            <a href="index.html" tabindex="0">首頁</a><span tabindex="0">/系統管理</span>
        </section>
        <section class="col-10 my-3 mx-auto p-2">
            <article class="card card-body">
                <form id="search" class="row">
                    <span id="record"></span>
                    <div class="col">
                        <label for="location">選擇夜市</label>
                        <select name="location" id="location" class="form-control"></select>
                    </div>
                    <div class="col">
                        <label for="keyword">關鍵字</label>
                        <input type="text" name="keyword" id="keyword" class="form-control">
                    </div>
                    <div class="col">
                        <label for="sorting">排序</label>
                        <select name="sorting" id="sorting" class="form-control">
                            <option value="date+asc">日期(升冪)</option>
                            <option value="date+desc">日期(降冪)</option>
                            <option value="rate+asc">評分(升冪)</option>
                            <option value="rate+desc">評分(降冪)</option>
                            <option value="likes+asc">按讚數(升冪)</option>
                            <option value="likes+desc">按讚數(降冪)</option>
                        </select>
                    </div>
                    <div class="col">
                        <label for="layout">呈現方式</label>
                        <select name="layout" id="layout" class="form-control">
                            <option value="card">卡片</option>
                            <option value="table">表格</option>
                        </select>
                    </div>
                    <div class="col-auto"><button class="btn btn-primary">查詢</button></div>
                </form>
            </article>
        </section>
        <section class="p-1 mx-auto my-3 col-10" id="result"></section>
    </main>
    <footer class="text-center">
        <p>第19屆全國身心障礙者技能競賽 模擬練習 設計者：Web67</p>
    </footer>
    <div class="modal fade">
        <div class="modal-dialog">
            <form class="modal-content modal-body" id="form">
                <div class="mb-3">
                    <label for="name">暱稱</label>
                    <input type="text" class="form-control" required name="name" id="name">
                </div>
                <div class="mb-3">
                    <label for="email">Email</label>
                    <input type="email" class="form-control" required name="email" id="email">
                </div>
                <div class="mb-3">
                    <label for="market">夜市</label>
                    <select class="form-control" required name="market" id="market"></select>
                </div>
                <div class="mb-3">
                    <label for="stand">小吃名稱</label>
                    <input type="text" class="form-control" required name="stand" id="stand">
                </div>
                <div class="mb-3">
                    <label for="price">價格</label>
                    <input type="number" class="form-control" required name="price" id="price" min="10" max="500">
                </div>
                <div class="mb-3">
                    <label for="rate">評分</label>
                    <input type="number" class="form-control" required name="rate" id="rate" min="1" max="5">
                </div>
                <div class="mb-3">
                    <label for="date">日期</label>
                    <input type="date" class="form-control" required name="date" id="date" max="2026-10-20">
                </div>
                <div class="mb-3">
                    <label for="feedback">心得摘要</label>
                    <textarea type="text" class="form-control" required name="feedback" id="feedback" minlength="15"></textarea>
                </div>
                <div class="mb-3">
                    <img src="" alt="" id="preview" class="w-100">
                    <label for="image">照片</label>
                    <input type="file" class="form-control" required name="image" id="image" accept=".png,.jpg,.jpeg">
                </div>
                <div class="mb-3"><button class="btn btn-primary">送出</button></div>
            </form>
        </div>
    <script src="bootstrap.js"></script>
    <script src="jqueryv4.0.0.js"></script>
    <script src="main.js"></script>
    <script>
        let rawData = []
        if (localStorage.getItem("login") != 1) {
            location.href = "login.html"
        }
        const COLS = [
            [`name`,"暱稱"],
            [`email`,"Email"],
            [`nightmarket`,"夜市"],
            [`stand`,"小吃名稱"],
            [`price`,"價格"],
            [`rate`,"評分"],
            [`date`,"日期"],
            [`feedback`,"心得摘要"],
            [`image`,"照片"],
            [`likes`,"按讚數"],
        ]
        function render() {
            $.post("api.php", {action: "locations"}, function (res) {
                const locations = JSON.parse(res)
                let html = "<option value='all'>所有城市</option>"
                locations.forEach((row) => {
                    html += `<option value="${row['nightmarket']}">${row['nightmarket']}</option>`
                });
                $("#location").html(html)
                $("#market").html(html)
            })
            $.post("api.php", {action: "record"}, function (res) {
                $("#record").text("已刪除:"+res)
            })
        }
        render()
        function card(data) {
            html = "<article class='row row-cols-1 row-cols-md-2'>"
            if (data.length > 0) {
                data.forEach((row) => {
                    html += `<article class='col p-1'><article class='card card-body'>
                        ${COLS.map(([key,label]) => {
                        const val = row[key]
                        if (val == null) return `<article tabindex="0">${label}:<br>${empty()}</article>`
                        if (key == "image") return `<article tabindex="0">${label}:<br><img class="w-100" src="${val}" alt="${val}"></article>`
                        if (key == "email") return `<article tabindex="0">${label}:<br><a class="email">${val}</a></article>`
                        else return `<article tabindex="0">${label}:<br>${val}</article>`
                    }).join("")}
                    <button class="btn btn-danger del" data-id="${row['id']}">刪除</button><button class="btn btn-warning edit" onclick="${edit(row)}">編輯</button>
                    </article></article>`
                });
            } else {
                html += empty()
            }
            html += "</article>"

            $("#result").html(html)
        }
        function table(data) {
            html = `<article class='card card-body'><table class='table'><tr>
            ${COLS.map(([key, label]) => {
                return `<th tabindex="0">${label}</th>`
            }).join("")}<th tabindex="0">功能</th></tr>`
            if (data.length > 0) {
                data.forEach((row) => {
                    html += `<tr>
                        ${COLS.map(([key,label]) => {
                            const val = row[key]
                            if (val == null) return `<td tabindex="0">${empty()}</td>`
                            if (key == "image") return `<td tabindex="0"><img class="w-100" src="${val}" alt="${val}"></td>`
                            if (key == "email") return `<td tabindex="0"><a class="email">${val}</a></td>`
                            else return `<td tabindex="0">${val}</td>`
                        }).join("")}
                        <td><button class="btn btn-danger del" data-id="${row['id']}">刪除</button><button class="btn btn-warning edit" onclick="${edit(row)}">編輯</button></td>
                        </tr>`
                    });
            } else {
                html += empty()
            }
            html += "</table></article>"
            
            $("#result").html(html)
        }
        $(document).on("click",".email",function () {
            const email = $(this).text()
            let result = rawData.filter((row) => row.email == email)
            card(result)
        })
        $(document).on("click",".del",function () {
            const id = $(this).data("id")
            $.post("api.php",{action: "del",id: id},() => {
                alert("已刪除")
                location.reload()
            })
        })
        $("#search").on("submit", function (e) {
            e.preventDefault()
            const form = new FormData(this)
            form.append("action", "admin")
            fetch("api.php", {method: "POST", body: form})
            .then((res) => res.json())
            .then((res) => {
                rawData = res
                if (form.get("layout") == "card") {
                    card(res)
                } else {
                    table(res)
                }
            })
        })
        function edit(row) {
            COLS.map(([key,label]) => {
                console.log($(`#form [name='${key}']`));
                $(`#form [name='${key}']:not([type="file"])`).val(row[key])
            })
            $("#preview").attr("src",row.image)
            $("#preview").attr("alt",row.image)
            $("div.modal").modal("show")
        }
        </script>
</body>

</html>
